<!DOCTYPE html>
<!--
ТЕХНИЧЕСКОЕ ЗАДАНИЕ

Цель: Создать интерактивную анимированную диаграмму "гонка" населения стран/городов.

Функциональные требования:
1. Анимированная горизонтальная диаграмма (bar chart race):
   - Плавная анимация перехода между годами
   - Автоматическое переупорядочивание столбцов
   - Отображение текущего года
   - Значения населения на столбцах

2. Режимы отображения:
   - Страны мира
   - Крупнейшие города мира

3. Управление анимацией:
   - Воспроизведение/пауза
   - Скорость анимации
   - Перемотка к году
   - Перезапуск

4. Пользовательский интерфейс:
   - Темная и светлая тема
   - Многоязычность (русский/английский)
   - Адаптивный дизайн
   - Флаги стран / иконки городов

Технические требования:
1. DOM-анимация и CSS переходы для отрисовки диаграммы
2. Vanilla JavaScript без фреймворков
3. Адаптивный дизайн
-->
<html lang="ru">
<head>

    [data-theme="light"] {

    body {

    .container {

    /* Header */
    header {

      margin-bottom: 20px;
      padding: 20px 0;
      position: relative;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {

      font-size: clamp(1rem, 2.5vw, 1.2rem);

    /* Year display */
    .year-display {

      top: 50%;

      color: var(--primary-color);
      opacity: 0.3;
      font-family: 'Courier New', monospace;
      text-shadow: var(--glow);
    }

    /* Settings button */
    .settings-button {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--primary-color);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .settings-button:hover {
      transform: rotate(45deg);
      box-shadow: var(--glow);
    }

    /* Settings modal */
    .settings-modal {
      display: none;
      position: fixed;
      top: 80px;
      right: 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      z-index: 1001;
      min-width: 280px;
    }

    .settings-modal.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .settings-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--primary-color);
    }

    .settings-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .settings-option label {
      color: var(--text-color);
      font-size: 0.95rem;
    }

    /* Toggle switch */
    .toggle-switch {
      position: relative;
      width: 52px;
      height: 28px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--input-border);
      transition: 0.3s;
      border-radius: 28px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: var(--accent-gradient);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Controls */
    .controls-container {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }

    .mode-buttons {
      display: flex;
      gap: 8px;
      background: var(--input-bg);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--secondary-color);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .mode-btn:hover:not(.active) {
      color: var(--primary-color);
      background: var(--border-color);
    }

    .playback-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
      box-shadow: var(--glow);
    }

    .control-btn.play-btn {
      width: 60px;
      height: 60px;
      font-size: 22px;
      background: var(--accent-gradient);
      border: none;
      color: white;
    }

    .control-btn.play-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--input-bg);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .speed-control label {
      color: var(--secondary-color);
      font-size: 0.9rem;
    }

    .speed-slider {
      width: 100px;
      height: 6px;
      border-radius: 3px;
      background: var(--border-color);
      -webkit-appearance: none;
      cursor: pointer;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary-color);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 212, 255, 0.4);
    }

    .year-slider-container {
      flex: 1;
      min-width: 200px;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .year-slider {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: var(--border-color);
      -webkit-appearance: none;
      cursor: pointer;
    }

    .year-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-gradient);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.5);

    .year-label {
      color: var(--primary-color);
      font-weight: 600;
      font-size: 1.1rem;
      min-width: 60px;
      text-align: center;
    }

    .chart-container {

      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 600px;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    /* Bar styles */
    .bar-container {
      position: absolute;
      left: 0;
      right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bar-label {
      width: 140px;
      padding-right: 12px;
      text-align: right;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .bar-flag {
      font-size: 1.4rem;
    }

    .bar {
      height: 38px;
      border-radius: 0 8px 8px 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .bar-value {
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      z-index: 1;
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--secondary-color);
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    /* Stats */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .stat-card {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--secondary-color);
      margin-top: 4px;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      color: var(--secondary-color);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--primary-color);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 12px;
      }

      .year-display {
        position: static;
        transform: none;
        font-size: 3rem;
        text-align: center;
        margin-top: 10px;
      }

      .controls-row {
        flex-direction: column;
      }

      .mode-buttons {
        width: 100%;
        justify-content: center;
      }

      .year-slider-container {
        width: 100%;
        max-width: none;
      }

      .chart-wrapper {
        height: 500px;
      }

      .bar-label {
        width: 100px;
        font-size: 0.8rem;
      }

      .bar-flag {
        font-size: 1.1rem;
      }

      .bar {
        height: 32px;
        font-size: 0.75rem;
      }

      .bar-container {
        height: 40px;
      }

      .settings-modal {
        right: 10px;
        left: 10px;
        min-width: auto;
      }
    }

    @media (max-width: 480px) {
      .bar-label {
        width: 80px;
        font-size: 0.7rem;
      }

      .bar-flag {
        font-size: 1rem;
      }

      .chart-wrapper {
        height: 450px;
      }

      .control-btn {
        width: 40px;
        height: 40px;
        font-size: 14px;
      }

      .control-btn.play-btn {
        width: 50px;
        height: 50px;
        font-size: 18px;
      }
    }
  </style>
</head>

          </button>

        </div>

        <div class="speed-control">

          <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="3" step="0.5" value="1">
          <span id="speedValue">1x</span>
        </div>

        <div class="year-slider-container">
          <span class="year-label" id="startYear">1950</span>

          <span class="year-label" id="endYear">2024</span>
        </div>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-wrapper" id="chartWrapper">
        <!-- Bars will be dynamically inserted here -->
      </div>

      <div class="stats-container">
        <div class="stat-card">

        </div>
        <div class="stat-card">
          <div class="stat-value" id="topCountry">-</div>
          <div class="stat-label" data-i18n="leader">Лидер</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="growthRate">0%</div>
          <div class="stat-label" data-i18n="growthRate">Рост за год</div>
        </div>
      </div>
    </div>

    <footer>
      <p data-i18n="dataSource">Данные: Оценки ООН и World Bank</p>
      <p><a href="index.html" data-i18n="backToMain">← Вернуться на главную</a></p>
    </footer>
  </div>

        data: {
          1950: 1.1, 1955: 1.4, 1960: 1.9, 1965: 2.5, 1970: 3.1, 1975: 4.0,
          1980: 5.0, 1985: 6.0, 1990: 7.1, 1995: 8.5, 2000: 10.0, 2005: 11.6,
          2010: 13.1, 2015: 15.4, 2020: 16.1, 2024: 17.2
        }
      }
    };

    // Интерполяция данных для каждого года
    function interpolateData(dataObj) {
      const years = Object.keys(dataObj).map(Number).sort((a, b) => a - b);
      const result = {};

      for (let year = 1950; year <= 2024; year++) {
        if (dataObj[year] !== undefined) {
          result[year] = dataObj[year];
        } else {
          // Линейная интерполяция
          let prevYear = years.filter(y => y < year).pop();
          let nextYear = years.filter(y => y > year).shift();

          if (prevYear && nextYear) {
            const ratio = (year - prevYear) / (nextYear - prevYear);
            result[year] = dataObj[prevYear] + (dataObj[nextYear] - dataObj[prevYear]) * ratio;
          }
        }
      }
      return result;
    }

    // Подготовка интерполированных данных
    const interpolatedCountries = {};
    const interpolatedCities = {};

    Object.keys(countriesData).forEach(key => {
      interpolatedCountries[key] = {
        ...countriesData[key],
        data: interpolateData(countriesData[key].data)
      };
    });

    Object.keys(citiesData).forEach(key => {
      interpolatedCities[key] = {
        ...citiesData[key],
        data: interpolateData(citiesData[key].data)
      };
    });

    // Переводы
    const translations = {
      ru: {
        title: "Гонка населения",
        subtitle: "Динамика изменения населения с 1950 по 2024 год",
        settings: "Настройки",
        darkTheme: "Темная тема",
        language: "English",
        countries: "Страны",
        cities: "Города",
        speed: "Скорость:",
        totalPopulation: "Общее население (млрд)",
        leader: "Лидер",
        growthRate: "Рост за год",
        dataSource: "Данные: Оценки ООН и World Bank",
        backToMain: "← Вернуться на главную",
        million: "млн",
        billion: "млрд"
      },
      en: {
        title: "Population Race",
        subtitle: "Population dynamics from 1950 to 2024",
        settings: "Settings",
        darkTheme: "Dark theme",
        language: "Русский",
        countries: "Countries",
        cities: "Cities",
        speed: "Speed:",
        totalPopulation: "Total population (billion)",
        leader: "Leader",
        growthRate: "Year growth",
        dataSource: "Data: UN and World Bank estimates",
        backToMain: "← Back to main page",
        million: "M",
        billion: "B"
      }
    };

    // Состояние приложения
    const state = {
      mode: "countries",
      currentYear: 1950,
      isPlaying: false,
      speed: 1,
      animationId: null,
      lastFrameTime: 0,
      theme: "dark",
      lang: "ru"
    };

    // Элементы DOM
    const elements = {
      chartWrapper: document.getElementById("chartWrapper"),
      yearDisplay: document.getElementById("yearDisplay"),
      yearSlider: document.getElementById("yearSlider"),
      playBtn: document.getElementById("playBtn"),
      speedSlider: document.getElementById("speedSlider"),
      speedValue: document.getElementById("speedValue"),
      totalPopulation: document.getElementById("totalPopulation"),
      topCountry: document.getElementById("topCountry"),
      growthRate: document.getElementById("growthRate"),
      settingsBtn: document.getElementById("settingsBtn"),
      settingsModal: document.getElementById("settingsModal"),
      themeToggle: document.getElementById("themeToggle"),
      langToggle: document.getElementById("langToggle")
    };

    /**
     * @function getCurrentData
     * @description Получает текущие данные в зависимости от режима
     * @returns {Object} Объект с данными стран или городов
     */
    function getCurrentData() {
      return state.mode === "countries" ? interpolatedCountries : interpolatedCities;
    }

    /**
     * @function formatPopulation
     * @description Форматирует число населения
     * @param {number} value - Значение населения в миллионах
     * @returns {string} Форматированная строка
     */
    function formatPopulation(value) {
      const t = translations[state.lang];
      if (value >= 1000) {
        return (value / 1000).toFixed(2) + " " + t.billion;
      }
      return value.toFixed(1) + " " + t.million;
    }

    /**
     * @function getSortedData
     * @description Возвращает отсортированные данные для текущего года
     * @param {number} year - Год
     * @returns {Array} Массив отсортированных записей
     */
    function getSortedData(year) {
      const data = getCurrentData();
      const entries = Object.entries(data).map(([name, info]) => ({
        name,
        flag: info.flag,
        color: info.color,
        value: info.data[Math.floor(year)] || 0
      }));

      return entries.sort((a, b) => b.value - a.value).slice(0, 12);
    }

    /**
     * @function createBars
     * @description Создает элементы столбцов диаграммы
     */
    function createBars() {
      elements.chartWrapper.innerHTML = "";
      const data = getSortedData(state.currentYear);
      const maxValue = data[0]?.value || 1;
      const barHeight = state.mode === "countries" ? 48 : 48;
      const chartWidth = elements.chartWrapper.clientWidth - 160;

      data.forEach((item, index) => {
        const container = document.createElement("div");
        container.className = "bar-container";
        container.style.top = `${index * barHeight}px`;
        container.dataset.name = item.name;

        const label = document.createElement("div");
        label.className = "bar-label";
        label.innerHTML = `<span class="bar-flag">${item.flag}</span><span>${item.name}</span>`;

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.background = item.color;
        bar.style.width = `${(item.value / maxValue) * chartWidth}px`;

        const value = document.createElement("span");
        value.className = "bar-value";
        value.textContent = formatPopulation(item.value);

        bar.appendChild(value);
        container.appendChild(label);
        container.appendChild(bar);
        elements.chartWrapper.appendChild(container);
      });
    }

    /**
     * @function updateBars
     * @description Обновляет позиции и размеры столбцов
     * @param {number} year - Текущий год (может быть дробным)
     */
    function updateBars(year) {
      const data = getSortedData(year);
      const maxValue = data[0]?.value || 1;
      const barHeight = 48;
      const chartWidth = elements.chartWrapper.clientWidth - 160;
      const containers = elements.chartWrapper.querySelectorAll(".bar-container");

      // Создаем карту позиций
      const positionMap = {};
      data.forEach((item, index) => {
        positionMap[item.name] = {
          index,
          value: item.value
        };
      });

      containers.forEach(container => {
        const name = container.dataset.name;
        const info = positionMap[name];

        if (info) {
          container.style.top = `${info.index * barHeight}px`;
          const bar = container.querySelector(".bar");
          const valueEl = container.querySelector(".bar-value");
          bar.style.width = `${(info.value / maxValue) * chartWidth}px`;
          valueEl.textContent = formatPopulation(info.value);
        }
      });

      // Обновляем статистику
      updateStats(data, year);
    }

    /**
     * @function updateStats
     * @description Обновляет статистику
     * @param {Array} data - Отсортированные данные
     * @param {number} year - Текущий год
     */
    function updateStats(data, year) {
      const total = data.reduce((sum, item) => sum + item.value, 0);
      const totalBillions = (total / 1000).toFixed(2);
      elements.totalPopulation.textContent = totalBillions;

      if (data[0]) {
        elements.topCountry.textContent = data[0].name;
      }

      // Расчет роста
      const prevYear = Math.floor(year) - 1;
      if (prevYear >= 1950) {
        const prevData = getSortedData(prevYear);
        const prevTotal = prevData.reduce((sum, item) => sum + item.value, 0);
        const growth = ((total - prevTotal) / prevTotal * 100).toFixed(1);
        elements.growthRate.textContent = `+${growth}%`;
      }
    }

    /**
     * @function animate
     * @description Основной цикл анимации
     * @param {number} timestamp - Временная метка кадра
     */
    function animate(timestamp) {
      if (!state.isPlaying) return;

      if (!state.lastFrameTime) state.lastFrameTime = timestamp;
      const delta = timestamp - state.lastFrameTime;

      if (delta >= 50 / state.speed) {
        state.lastFrameTime = timestamp;
        state.currentYear += 0.1 * state.speed;

        if (state.currentYear >= 2024) {
          state.currentYear = 2024;
          stopAnimation();
        }

        updateUI();
      }

      state.animationId = requestAnimationFrame(animate);
    }

    /**
     * @function startAnimation
     * @description Запускает анимацию
     */
    function startAnimation() {
      state.isPlaying = true;
      state.lastFrameTime = 0;
      elements.playBtn.innerHTML = '<i class="fas fa-pause"></i>';
      state.animationId = requestAnimationFrame(animate);
    }

    /**
     * @function stopAnimation
     * @description Останавливает анимацию
     */
    function stopAnimation() {
      state.isPlaying = false;
      elements.playBtn.innerHTML = '<i class="fas fa-play"></i>';
      if (state.animationId) {
        cancelAnimationFrame(state.animationId);
        state.animationId = null;
      }
    }

    /**
     * @function updateUI
     * @description Обновляет интерфейс
     */
    function updateUI() {
      const displayYear = Math.floor(state.currentYear);
      elements.yearDisplay.textContent = displayYear;
      elements.yearSlider.value = displayYear;
      updateBars(state.currentYear);
    }

    /**
     * @function applyTranslations
     * @description Применяет переводы к интерфейсу
     */
    function applyTranslations() {
      const t = translations[state.lang];
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (t[key]) {
          el.textContent = t[key];
        }
      });

      // Обновляем заголовок
      document.title = state.lang === "ru"
        ? "Гонка населения | Population Race"
        : "Population Race | Гонка населения";
    }

    /**
     * @function applyTheme
     * @description Применяет тему
     */
    function applyTheme() {
      document.body.dataset.theme = state.theme;
    }

    /**
     * @function loadSettings
     * @description Загружает настройки из localStorage
     */
    function loadSettings() {
      const savedTheme = localStorage.getItem("populationRace_theme");
      const savedLang = localStorage.getItem("populationRace_lang");

      if (savedTheme) {
        state.theme = savedTheme;
        elements.themeToggle.checked = state.theme === "dark";
      }

      if (savedLang) {
        state.lang = savedLang;
        elements.langToggle.checked = state.lang === "en";
      }

      applyTheme();
      applyTranslations();
    }

    /**
     * @function saveSettings
     * @description Сохраняет настройки в localStorage
     */
    function saveSettings() {
      localStorage.setItem("populationRace_theme", state.theme);
      localStorage.setItem("populationRace_lang", state.lang);
    }

    // Обработчики событий
    elements.playBtn.addEventListener("click", () => {
      if (state.isPlaying) {
        stopAnimation();
      } else {
        if (state.currentYear >= 2024) {
          state.currentYear = 1950;
        }
        startAnimation();
      }
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      stopAnimation();
      state.currentYear = 1950;
      updateUI();
    });

    document.getElementById("endBtn").addEventListener("click", () => {
      stopAnimation();
      state.currentYear = 2024;
      updateUI();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      stopAnimation();
      state.currentYear = Math.max(1950, Math.floor(state.currentYear) - 1);
      updateUI();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      stopAnimation();
      state.currentYear = Math.min(2024, Math.floor(state.currentYear) + 1);
      updateUI();
    });

    elements.yearSlider.addEventListener("input", (e) => {
      stopAnimation();
      state.currentYear = parseInt(e.target.value);
      updateUI();
    });

    elements.speedSlider.addEventListener("input", (e) => {
      state.speed = parseFloat(e.target.value);
      elements.speedValue.textContent = state.speed + "x";
    });

    // Переключение режима
    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.mode = btn.dataset.mode;
        stopAnimation();
        state.currentYear = 1950;
        createBars();
        updateUI();
      });
    });

    // Настройки
    elements.settingsBtn.addEventListener("click", () => {
      elements.settingsModal.classList.toggle("active");
    });

    document.addEventListener("click", (e) => {
      if (!elements.settingsModal.contains(e.target) &&
          !elements.settingsBtn.contains(e.target)) {
        elements.settingsModal.classList.remove("active");
      }
    });

    elements.themeToggle.addEventListener("change", (e) => {
      state.theme = e.target.checked ? "dark" : "light";
      applyTheme();
      saveSettings();
    });

    elements.langToggle.addEventListener("change", (e) => {
      state.lang = e.target.checked ? "en" : "ru";
      applyTranslations();
      saveSettings();
      // Перерисовываем значения
      updateUI();
    });

    // Обработка изменения размера окна
    let resizeTimeout;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        createBars();
        updateUI();
      }, 100);
    });

    // Инициализация
    loadSettings();
    createBars();
    updateUI();
  </script>
